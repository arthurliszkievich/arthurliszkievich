<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Arthur Liszkievich - Back-End &amp; Systems Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#b3e5fc"/>
      <stop offset="1" stop-color="#4fc3f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="240" rx="18"/></clipPath>
    <style>
      .title { font: 800 58px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
      .sub { font: 500 20px 'Fira Code', Consolas, 'Courier New', monospace; fill: #4fc3f7; letter-spacing: 5px; }
      .chip { font: 600 13px 'Fira Code', Consolas, 'Courier New', monospace; fill: #e0f7fa; }
      .bar { font: 500 12px 'Fira Code', Consolas, 'Courier New', monospace; fill: #90a4ae; }
      .fade { animation: fade 1.2s ease-out both; }
      .rise { animation: rise 1s ease-out both; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .float { animation: float 7s ease-in-out infinite; }
      @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#dots)"/>
    <circle class="float" cx="120" cy="60" r="150" fill="url(#glow)"/>
    <circle class="float" cx="900" cy="200" r="170" fill="url(#glow)" style="animation-delay:-3s"/>

    <!-- window bar -->
    <rect width="1000" height="34" fill="#000000" fill-opacity="0.28"/>
    <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text class="bar" x="500" y="21" text-anchor="middle">~/arthurliszkievich — zsh</text>

    <!-- title -->
    <g class="rise">
      <text class="title" x="500" y="122" text-anchor="middle" fill="url(#title)">Arthur Liszkievich</text>
    </g>
    <g class="fade" style="animation-delay:.5s">
      <text class="sub" x="500" y="160" text-anchor="middle">BACK-END &amp; SYSTEMS ENGINEER<tspan class="blink" fill="#4fc3f7"> _</tspan></text>
    </g>

    <!-- chips -->
    <g class="fade" style="animation-delay:.9s">
      <rect x="248" y="184" width="100" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#4fc3f7" stroke-opacity="0.5"/>
      <text class="chip" x="298" y="203" text-anchor="middle">Python</text>
      <rect x="358" y="184" width="100" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#4fc3f7" stroke-opacity="0.5"/>
      <text class="chip" x="408" y="203" text-anchor="middle">Django</text>
      <rect x="468" y="184" width="84" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#4fc3f7" stroke-opacity="0.5"/>
      <text class="chip" x="510" y="203" text-anchor="middle">gRPC</text>
      <rect x="562" y="184" width="110" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#4fc3f7" stroke-opacity="0.5"/>
      <text class="chip" x="617" y="203" text-anchor="middle">Criptografia</text>
      <rect x="682" y="184" width="70" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#4fc3f7" stroke-opacity="0.5"/>
      <text class="chip" x="717" y="203" text-anchor="middle">APIs</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="239" rx="18" fill="none" stroke="#4fc3f7" stroke-opacity="0.25"/>
</svg>
